name: Sync Parquet Data

on:
  # Manual trigger
  workflow_dispatch:
  # Schedule: setiap hari jam 2 pagi UTC (atau sesuaikan timezone)
  schedule:
    - cron: '0 2 * * *'
  # Trigger saat push ke main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download Parquet data from SQL Server
        env:
          MSSQL_SERVER: ${{ secrets.MSSQL_SERVER }}
          MSSQL_DATABASE: ${{ secrets.MSSQL_DATABASE }}
          MSSQL_USERNAME: ${{ secrets.MSSQL_USERNAME }}
          MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
          MSSQL_ENCRYPT: 'false'
          MSSQL_TRUST_SERVER_CERTIFICATE: 'false'
          MSSQL_QUERY: 'SELECT * FROM rpt.Pendaftaran_Looker_func1()'
        run: npm run download-data
      
      - name: Check if parquet file was created
        run: |
          if [ -f public/data/peta_murid.parquet ]; then
            echo "✅ Parquet file created successfully"
            ls -lh public/data/peta_murid.parquet
          else
            echo "❌ Parquet file not found!"
            exit 1
          fi
      
      - name: Commit and push parquet file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/peta_murid.parquet public/data/download.log
          if git diff --cached --quiet; then
            echo "No parquet changes to commit"
            exit 0
          fi
          git commit -m "Update parquet data from SQL Server"
          git push
