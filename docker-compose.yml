version: '3.8'

services:
  ppdb-dashboard:
    build: .
    container_name: ppdb-dashboard
    ports:
      - "5176:5176"
    volumes:
      - ./public/data:/app/public/data
      - ./src:/app/src
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - ppdb-network
    restart: unless-stopped

volumes:
  node_modules:

networks:
  ppdb-network:
    driver: bridge
